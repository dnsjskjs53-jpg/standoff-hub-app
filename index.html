<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ALLIANCE FACEIT | R:E</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --bg-main: #0c0809;
      --bg-card: #181012;
      --bg-card-2: #221518;
      --border: #3a1d22;
      --accent: #e52535;
      --accent-dark: #9e1022;
      --accent-glow: rgba(229, 37, 53, 0.25);
      --text-main: #ffffff;
      --text-muted: #9c8a8d;
      --warn-border: #8c5819;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      background-image:
        radial-gradient(circle at 50% 0%, rgba(229, 37, 53, 0.18), transparent 55%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
      color: var(--text-main);
      padding-bottom: 90px;
      min-height: 100vh;
    }

    /* TOPBAR */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(12, 8, 9, 0.92);
      backdrop-filter: blur(10px);
      padding: 12px 16px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 900;
      font-style: italic;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .brand-text {
      line-height: 1;
      font-size: 13px;
    }

    .brand-sub {
      font-size: 9px;
      color: var(--accent);
      letter-spacing: 1.5px;
      margin-top: 2px;
    }

    .mode-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .mode-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .balance-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      color: #ff6b78;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .verify-banner {
      margin-top: 10px;
      background: linear-gradient(90deg, rgba(160, 82, 18, 0.35), rgba(229, 37, 53, 0.25));
      border: 1px solid var(--warn-border);
      border-radius: 10px;
      padding: 8px 12px;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      color: #ffd180;
      letter-spacing: 0.4px;
      cursor: pointer;
    }

    /* CONTAINER & SCREENS */
    .container {
      padding: 14px 16px;
      max-width: 520px;
      margin: 0 auto;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* CARDS & BUTTONS */
    .card {
      background: linear-gradient(180deg, var(--bg-card) 0%, #120b0d 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
    }

    .card-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-red {
      background: linear-gradient(180deg, #f02d3d 0%, #b81825 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(229, 37, 53, 0.35);
    }

    .btn-dark {
      background: var(--bg-card-2);
      color: #fff;
      border: 1px solid var(--border);
    }

    /* PLAY SCREEN */
    .hero-play {
      background:
        radial-gradient(circle at 80% 30%, rgba(229, 37, 53, 0.38), transparent 60%),
        linear-gradient(135deg, #1d1013 0%, #11090b 100%);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 16px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }

    .hero-wm {
      position: absolute;
      right: -10px;
      bottom: 42px;
      font-size: 28px;
      font-weight: 900;
      font-style: italic;
      color: rgba(255, 255, 255, 0.06);
      transform: rotate(-12deg);
      pointer-events: none;
      line-height: 0.95;
    }

    .hero-title {
      font-size: 28px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1px;
    }

    .hero-online {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .mode-switch-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 24px;
    }

    .mode-tab {
      padding: 10px;
      border-radius: 999px;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
    }

    .mode-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .party-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .icon-square {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(229, 37, 53, 0.14);
      border: 1px solid rgba(229, 37, 53, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 16px;
      flex-shrink: 0;
    }

    .lobby-card {
      position: relative;
    }

    .lobby-bg-num {
      position: absolute;
      right: 12px;
      bottom: -8px;
      font-size: 68px;
      font-weight: 900;
      font-style: italic;
      color: rgba(229, 37, 53, 0.08);
      pointer-events: none;
      line-height: 1;
    }

    .lobby-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .lobby-name {
      font-size: 17px;
      font-weight: 900;
      font-style: italic;
    }

    .lobby-count {
      font-size: 15px;
      font-weight: 800;
      margin-right: 10px;
    }

    .players-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .player-slot {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
    }

    .player-slot.me {
      border-color: var(--accent);
      background: rgba(229, 37, 53, 0.14);
    }

    .lvl-badge {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid #ff8a00;
      color: #ff8a00;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lobby-footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      gap: 14px;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* CHART */
    .bars-wrap {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 60px;
      gap: 4px;
      margin: 12px 0 6px;
    }

    .bar {
      flex: 1;
      background: #2f2326;
      border-radius: 3px;
    }

    .bar.peak {
      background: #6c63ff;
    }

    .bar.warn {
      background: var(--accent);
    }

    .night-bonus {
      margin-top: 10px;
      background: rgba(76, 68, 182, 0.22);
      border: 1px solid rgba(108, 99, 255, 0.45);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 11px;
      color: #c5c1ff;
    }

    /* PROFILE SCREEN */
    .profile-banner {
      background: linear-gradient(135deg, #2d1216 0%, #160c0e 100%);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }

    .banner-wm {
      position: absolute;
      right: -6px;
      top: 4px;
      font-size: 38px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.06);
      line-height: 0.9;
      pointer-events: none;
    }

    .avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: #2b1519;
      display: flex;
      align-items: center;
