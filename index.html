<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CF STANDOFFKNIFE - FACEIT</title>
  <script src="https://telegram.org"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    :root {
      --bg-main: #110c0e;
      --bg-card: #191215;
      --bg-slot: #24191d;
      --border-color: #2f2025;
      --accent-red: #e52538;
      --accent-red-glow: rgba(229, 37, 56, 0.45);
      --accent-red-bg: rgba(229, 37, 56, 0.14);
      --text-primary: #ffffff;
      --text-secondary: #9b8c91;
      --text-muted: #68595e;
      --gold: #f5b041;
      --green: #2ecc71;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 84px;
      overflow-x: hidden;
    }

    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(180deg, #1b1114 0%, #110c0e 100%);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      width: 34px; height: 34px; background: var(--accent-red); border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 15px; color: #fff;
    }
    .brand-title { font-size: 13px; font-weight: 800; line-height: 1.1; }
    .brand-sub { font-size: 10px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.8px; margin-top: 2px; }

    .mode-pill {
      display: flex; align-items: center; gap: 6px; background: var(--bg-card);
      border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 20px;
      font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .mode-dot { width: 7px; height: 7px; background: var(--accent-red); border-radius: 50%; box-shadow: 0 0 6px var(--accent-red); }

    .elo-badge {
      display: flex; align-items: center; gap: 5px; background: #231814;
      border: 1px solid #3c281e; padding: 6px 11px; border-radius: 20px;
      font-size: 12px; font-weight: 800; color: var(--gold);
    }

    .container { padding: 0 14px; max-width: 500px; margin: 0 auto; }

    .verify-banner {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(90deg, rgba(245, 176, 65, 0.12), rgba(230, 126, 34, 0.16), rgba(245, 176, 65, 0.12));
      border: 1px solid rgba(245, 176, 65, 0.35); border-radius: 12px;
      padding: 10px 14px; margin-bottom: 14px; color: var(--gold);
      font-size: 11.5px; font-weight: 800; cursor: pointer;
    }

    .hero-card {
      position: relative;
      background: radial-gradient(circle at 85% 20%, rgba(229, 37, 56, 0.25) 0%, rgba(35, 18, 23, 0.95) 65%, #181114 100%);
      border: 1px solid rgba(229, 37, 56, 0.28); border-radius: 18px;
      padding: 20px 16px 16px; margin-bottom: 12px; overflow: hidden;
    }
    .hero-watermark {
      position: absolute; right: -12px; top: 12px; font-size: 23px; font-weight: 900;
      line-height: 0.95; color: rgba(255, 255, 255, 0.05); transform: rotate(-10deg);
      pointer-events: none; text-align: right; user-select: none;
    }
    .hero-title { font-size: 26px; font-weight: 900; margin-bottom: 4px; }
    .hero-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 18px; }
    .hero-sub span { color: #fff; font-weight: 700; }

    .queue-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .q-btn {
      padding: 12px 10px; border-radius: 24px; font-size: 11px; font-weight: 800;
      border: 1px solid var(--border-color); background: rgba(25, 18, 21, 0.85);
      color: var(--text-secondary); display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
    }
    .q-btn.active { background: var(--accent-red); border-color: var(--accent-red); color: #fff; box-shadow: 0 4px 16px rgba(229, 37, 56, 0.4); }

    .party-card {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
      padding: 12px 14px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between;
    }
    .party-left { display: flex; align-items: center; gap: 12px; }
    .party-icon {
      width: 38px; height: 38px; border-radius: 11px; background: rgba(52, 152, 219, 0.14);
      border: 1px solid rgba(52, 152, 219, 0.25); display: flex; align-items: center; justify-content: center; font-size: 17px;
    }
    .party-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .party-desc { font-size: 11px; color: var(--text-secondary); }
    .party-btn { background: var(--bg-slot); border: 1px solid var(--border-color); color: #fff; padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; }

    .lobby-card {
      position: relative; background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 14px; margin-bottom: 12px; overflow: hidden;
    }
    .lobby-bg-num { position: absolute; right: 12px; bottom: -10px; font-size: 56px; font-weight: 900; color: rgba(255, 255, 255, 0.025); pointer-events: none; }
    .lobby-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .lobby-name { font-size: 14px; font-weight: 800; }
    .lobby-actions { display: flex; align-items: center; gap: 10px; }
    .lobby-count { font-size: 13px; font-weight: 700; color: var(--text-secondary); }
    .lobby-count b { color: #fff; }

    .join-btn {
      background: var(--accent-red); color: #fff; border: none; padding: 8px 16px;
      border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .join-btn.leave { background: #2d1f24; border: 1px solid #4d323b; color: #ff8a96; }
    .join-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .lobby-empty { font-size: 12px; color: var(--text-muted); padding: 4px 0 2px; }
    .players-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; margin-bottom: 12px; }
    .player-slot {
      background: var(--bg-slot); border: 1px solid var(--border-color); border-radius: 10px;
      padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 600;
    }
    .player-slot.is-me { border-color: rgba(229, 37, 56, 0.55); background: rgba(229, 37, 56, 0.1); }
    .player-nick { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 105px; }

    .lvl-badge { width: 22px; height: 22px; border-radius: 50%; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .lvl-low { border: 1.5px solid #95a5a6; color: #bdc3c7; }
    .lvl-mid { border: 1.5px solid #f39c12; color: #f39c12; }
    .lvl-high { border: 1.5px solid #e74c3c; color: #e74c3c; }

    .lobby-footer { display: flex; align-items: center; gap: 14px; font-size: 11px; color: var(--text-secondary); border-top: 1px solid rgba(255, 255, 255, 0.04); padding-top: 8px; }
    .lobby-footer b { color: #fff; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: #140e10;
      border-top: 1px solid var(--border-color); display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 6px 6px 10px; z-index: 60;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px 2px; border-radius: 12px; color: var(--text-secondary); font-size: 9.5px; font-weight: 700; cursor: pointer; }
    .nav-item.active { background: var(--accent-red-bg); color: var(--accent-red); }
    .nav-icon { font-size: 16px; line-height: 1; }

    .screen { display: none; }
    .screen.active { display: block; }
    .section-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .stat-box { background: var(--bg-slot); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; text-align: center; }
    .stat-val { font-size: 16px; font-weight: 800; color: #fff; }
    .stat-lbl { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }

    /* PREMIUM CYBERSPORT AUTH OVERLAY */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(229, 37, 56, 0.25) 0%, rgba(11, 7, 9, 0.97) 62%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 200;
      animation: fadeIn 0.25s ease-out;
    }
    .auth-overlay.open { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .auth-card {
      position: relative;
      background: linear-gradient(165deg, #23161a 0%, #160e11 55%, #110a0c 100%);
      border: 1.5px solid rgba(229, 37, 56, 0.45);
      border-radius: 24px;
      padding: 24px 20px 22px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(229, 37, 56, 0.16);
      overflow: hidden;
    }

    .auth-card::before {
      content: "";
      position: absolute;
      top: 0; left: 15%; right: 15%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff3b4e, transparent);
    }
