  <style>
    :root {
      --bg-main: #110c0e;

      --bg-slot: #24191d;

      --accent-red: #e52538;
      --accent-red-glow: rgba(229, 37, 56, 0.45);
      --accent-red-bg: rgba(229, 37, 56, 0.14);
      --text-primary: #ffffff;
      --text-secondary: #9b8c91;
      --text-muted: #68595e;
      --gold: #f5b041;
      --green: #2ecc71;
      --ct-blue: #3498db;
      --t-orange: #e67e22;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 86px;
      overflow-x: hidden;
    }

    /* Header */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(180deg, #1b1114 0%, #110c0e 100%);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      width: 34px; height: 34px; background: var(--accent-red); border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 15px; color: #fff;
    }
    .brand-title { font-size: 13px; font-weight: 800; line-height: 1.1; }
    .brand-sub { font-size: 10px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.8px; margin-top: 2px; }

    .mode-pill {
      display: flex; align-items: center; gap: 6px; background: var(--bg-card);
      border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 20px;
      font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .mode-dot { width: 7px; height: 7px; background: var(--accent-red); border-radius: 50%; box-shadow: 0 0 6px var(--accent-red); }

    .elo-badge {
      display: flex; align-items: center; gap: 5px; background: #231814;
      border: 1px solid #3c281e; padding: 6px 11px; border-radius: 20px;
      font-size: 12px; font-weight: 800; color: var(--gold);
    }

    .container { padding: 0 14px; max-width: 500px; margin: 0 auto; }

    .verify-banner {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(90deg, rgba(245, 176, 65, 0.12), rgba(230, 126, 34, 0.16), rgba(245, 176, 65, 0.12));
      border: 1px solid rgba(245, 176, 65, 0.35); border-radius: 12px;
      padding: 10px 14px; margin-bottom: 12px; color: var(--gold);
      font-size: 11.5px; font-weight: 800; cursor: pointer;
    }

    /* Hero Card */
    .hero-card {
      position: relative;
      background: radial-gradient(circle at 85% 20%, rgba(229, 37, 56, 0.25) 0%, rgba(35, 18, 23, 0.95) 65%, #181114 100%);
      border: 1px solid rgba(229, 37, 56, 0.28); border-radius: 18px;
      padding: 18px 16px 15px; margin-bottom: 10px; overflow: hidden;
    }
    .hero-watermark {
      position: absolute; right: -10px; top: 10px; font-size: 22px; font-weight: 900;
      line-height: 0.95; color: rgba(255, 255, 255, 0.05); transform: rotate(-10deg);
      pointer-events: none; text-align: right; user-select: none;
    }
    .hero-title { font-size: 25px; font-weight: 900; margin-bottom: 3px; }
    .hero-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; }
    .hero-sub span { color: #fff; font-weight: 700; }

    .queue-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .q-btn {
      padding: 11px 8px; border-radius: 22px; font-size: 11px; font-weight: 800;
      border: 1px solid var(--border-color); background: rgba(25, 18, 21, 0.85);
      color: var(--text-secondary); display: flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer;
    }
    .q-btn.active { background: var(--accent-red); border-color: var(--accent-red); color: #fff; box-shadow: 0 4px 16px rgba(229, 37, 56, 0.4); }

    /* Social Cards (Party & Friends) */
    .social-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 12px;
    }

    .social-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 15px;
      padding: 11px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .social-card:active { border-color: var(--accent-red); }

    .social-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .social-icon {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .icon-party { background: rgba(52, 152, 219, 0.15); border: 1px solid rgba(52, 152, 219, 0.3); }
    .icon-friends { background: rgba(46, 204, 113, 0.15); border: 1px solid rgba(46, 204, 113, 0.3); }

    .social-title { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .social-sub { font-size: 10.5px; color: var(--text-secondary); margin-top: 1px; }

    /* Lobby Card */
    .lobby-card {
      position: relative; background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 14px; margin-bottom: 11px; overflow: hidden;
    }
    .lobby-bg-num { position: absolute; right: 12px; bottom: -10px; font-size: 54px; font-weight: 900; color: rgba(255, 255, 255, 0.025); pointer-events: none; }
    .lobby-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .lobby-name { font-size: 13.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .test-tag {
      background: rgba(245, 176, 65, 0.16); color: var(--gold); border: 1px solid rgba(245, 176, 65, 0.35);
      font-size: 9px; padding: 2px 6px; border-radius: 6px; font-weight: 800;
    }
    .lobby-actions { display: flex; align-items: center; gap: 10px; }
    .lobby-count { font-size: 13px; font-weight: 700; color: var(--text-secondary); }
    .lobby-count b { color: #fff; }

    .join-btn {
      background: var(--accent-red); color: #fff; border: none; padding: 7px 15px;
      border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .join-btn.leave { background: #2d1f24; border: 1px solid #4d323b; color: #ff8a96; }
    .join-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .lobby-empty { font-size: 12px; color: var(--text-muted); padding: 3px 0 1px; }
    .players-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; margin-bottom: 10px; }
    .player-slot {
      background: var(--bg-slot); border: 1px solid var(--border-color); border-radius: 10px;
      padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600;
    }
    .player-slot.is-me { border-color: rgba(229, 37, 56, 0.55); background: rgba(229, 37, 56, 0.1); }
    .player-nick { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 105px; }

    .lvl-badge { width: 21px; height: 21px; border-radius: 50%; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .lvl-low { border: 1.5px solid #95a5a6; color: #bdc3c7; }
    .lvl-mid { border: 1.5px solid #f39c12; color: #f39c12; }
    .lvl-high { border: 1.5px solid #e74c3c; color: #e74c3c; }

    .lobby-footer { display: flex; align-items: center; gap: 14px; font-size: 11px; color: var(--text-secondary); border-top: 1px solid rgba(255, 255, 255, 0.04); padding-top: 8px; }
    .lobby-footer b { color: #fff; }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: #140e10;
      border-top: 1px solid var(--border-color); display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 6px 6px 10px; z-index: 60;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px 2px; border-radius: 12px; color: var(--text-secondary); font-size: 9.5px; font-weight: 700; cursor: pointer; }
    .nav-item.active { background: var(--accent-red-bg); color: var(--accent-red); }
    .nav-icon { font-size: 16px; line-height: 1; }

    .screen { display: none; }
    .screen.active { display: block; }
    .section-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .stat-box { background: var(--bg-slot); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; text-align: center; }
    .stat-val { font-size: 16px; font-weight: 800; color: #fff; }
    .stat-lbl { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }

    /* Modals & Overlays */
    .overlay {
      position: fixed; inset: 0; background: rgba(10, 7, 8, 0.92);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      display: none; align-items: center; justify-content: center; padding: 14px; z-index: 180;
    }
    .overlay.open { display: flex; }
